<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Film & Dizi Günlüğü</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='22' fill='%23111113' stroke='%23c9a227' stroke-width='3'/><path d='M24 12 L27 20 L35 20 L28.5 25 L31 33 L24 28 L17 33 L19.5 25 L13 20 L21 20 Z' fill='%23c9a227'/></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="navbar">
    <div class="nav-icerik">
      <div class="nav-sol">
        <a href="/" class="navbar-mark">
          <svg class="seal" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="22" stroke="#c9a227" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="17" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
            <path d="M24 12 L27 20 L35 20 L28.5 25 L31 33 L24 28 L17 33 L19.5 25 L13 20 L21 20 Z" fill="#c9a227"/>
          </svg>
          <div class="wordmark">CONGRESS</div></a><span class="nav-ayrac"></span>
        <a href="/uyeler" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>ÜYELER</span></a>
        <a href="/filmler" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M7 4v16M17 4v16M2.5 9h19M2.5 15h19"/></svg><span>FİLM &amp; DİZİ</span></a>
        <a href="https://congress.archiedux.com" target="_blank" class="nav-link" style="color: var(--brass-bright);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>CONGRESS WİKİ</span></a>
      </div>
      <div class="nav-sag" id="navSag"></div>
    </div>
  </div>

  <div class="mainframe" id="profilAlani" style="display:none;">
    <div class="kapak kapak-bos" id="pKapak"></div>
    <div class="header">
      <div class="avatar-sarici">
        <img id="pAvatar" src="" class="avatar" />
      </div>
      <div class="name">
        <h1 id="pIsim">—</h1>
        <div class="seviye-satir">
          <span class="seviye-rozet" id="pSeviye">Lv. 1</span>
          <span class="seviye-xp" id="pSeviyeIlerleme">0/100 XP</span>
        </div>
        <div class="seviye-cubugu"><div class="seviye-doluluk" id="pSeviyeDoluluk" style="width:0%"></div></div>
        <p id="pUnvan">Ünvan yok</p>
      </div>
      <div class="header-sag-panel">
        <a id="gunlukBack" class="duzenle-btn" href="#" style="text-decoration:none; text-align:center; display:inline-block;">← Profile Dön</a>
      </div>
    </div>

    <div class="gunluk-icerik">
      <div class="gunluk-sekmeler">
        <button type="button" class="sekmeler-btn aktif" id="gunlukSekmeFilm" onclick="gunlukSekmesi('film')">Film &amp; Dizi</button>
        <button type="button" class="sekmeler-btn" id="gunlukSekmeKitap" onclick="gunlukSekmesi('kitap')">Kitap</button>
      </div>

      <div id="gunlukFilmIcerik">
        <div class="gunluk-bolum">
          <div class="gunluk-baslik">Favori Filmin</div>
          <div id="favoriFilmAlani" class="favori-film-alani"></div>
        </div>

        <div class="gunluk-bolum">
          <div class="gunluk-baslik">Film &amp; Dizi Günlüğü</div>
          <div class="gunluk-arama-kutu">
            <input id="gunlukArama" type="text" maxlength="100" placeholder="İzlediğin film/dizi ara..." oninput="gunlukAramaDegisti()" />
            <span class="film-ara-ipucu">Aradığında sadece "İzledim" dediğin kayıtlar listelenir.</span>
          </div>
          <div id="gunlukListe" class="gunluk-list"></div>
        </div>
      </div>

      <div id="gunlukKitapIcerik" style="display:none;">
        <div class="gunluk-bolum">
          <div class="gunluk-baslik">Favori Kitabın</div>
          <div id="favoriKitapAlani" class="favori-film-alani"></div>
        </div>

        <div class="gunluk-bolum">
          <div class="gunluk-baslik">Kitap Günlüğü</div>
          <div class="gunluk-arama-kutu">
            <input id="kitapGunlukArama" type="text" maxlength="100" placeholder="Okuduğun kitap ara..." oninput="kitapGunlukAramaDegisti()" />
            <span class="film-ara-ipucu">Aradığında sadece "Okudum" dediğin kayıtlar listelenir.</span>
          </div>
          <div id="kitapGunlukListe" class="gunluk-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hero" id="yukleniyorAlani">
    <p>Günlük yükleniyor...</p>
  </div>

<script src="js/app.js"></script>
<script>
  gunlukSayfasiBaslat();
</script>
</body>
</html>
