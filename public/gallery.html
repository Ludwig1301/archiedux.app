<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='22' fill='%23111113' stroke='%23c9a227' stroke-width='3'/><path d='M24 12 L27 20 L35 20 L28.5 25 L31 33 L24 28 L17 33 L19.5 25 L13 20 L21 20 Z' fill='%23c9a227'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar">
    <div class="nav-icerik">
      <div class="nav-sol">
        <a href="/" class="navbar-mark">
          <svg class="seal" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="22" stroke="#c9a227" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="17" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
            <path d="M24 12 L27 20 L35 20 L28.5 25 L31 33 L24 28 L17 33 L19.5 25 L13 20 L21 20 Z" fill="#c9a227"/>
          </svg>
          <div class="wordmark">CONGRESS<span>TOPLULUK PROFİLLERİ</span></div>
        </a>
        <a href="/uyeler">ÜYELER</a>
      </div>
      <div class="nav-sag" id="navSag"></div>
    </div>
  </div>

  <div class="mainframe">
    <div class="gallery-page">
      <div class="gallery-hero">
        <h1 id="galleryOwnerName">Galeri</h1>
        <p id="galleryFormHint">Başarılarını ve anılarını burada sergile.</p>
        <a id="galleryBack" class="gallery-back" href="#">← Profile Dön</a>
      </div>

      <div class="gallery-form" id="galleryForm">
        <div class="dosya-secici" onclick="document.getElementById('galleryFile').click()">
          <div class="dosya-secici-onizleme" id="galleryPreview"></div>
          <div class="dosya-secici-metin">
            <strong>Bilgisayarından görsel seç</strong>
            <span>PNG, JPG, GIF veya WEBP</span>
          </div>
        </div>
        <input type="file" id="galleryFile" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none;" onchange="galeriOnizlemeGuncelle()" />
        <textarea id="galleryDescription" placeholder="Bu görsel için bir açıklama yaz... (örn: Hangi başarı, hangi an?)"></textarea>
        <button onclick="galeriEkle()">Başarı Ekle</button>
      </div>
      <div class="gallery-status" id="galleryStatus"></div>

      <div id="galleryContent" class="gallery-list"></div>
    </div>
  </div>

  <div class="gallery-lightbox" id="galleryLightbox" style="display:none;" onclick="galeriLightboxKapat(event)">
    <div class="gallery-lightbox-card" onclick="event.stopPropagation()">
      <button type="button" class="gallery-lightbox-close" onclick="galeriLightboxKapat()" aria-label="Kapat">×</button>
      <div class="gallery-lightbox-media"><img id="galleryLightboxImage" src="" alt="" /></div>
      <aside class="gallery-lightbox-side">
        <h2 id="galleryLightboxTitle">Galeri görseli</h2>
        <p id="galleryLightboxDescription"></p>
        <div class="gallery-comments-title">Yorumlar</div>
        <div id="galleryComments" class="gallery-comments"></div>
        <div id="galleryCommentForm" class="gallery-comment-form" style="display:none;">
          <textarea id="galleryCommentText" maxlength="300" placeholder="Bu görsel hakkında yorum yaz..."></textarea>
          <button type="button" onclick="galeriYorumGonder()">Yorum Yap</button>
        </div>
        <div id="galleryCommentHint" class="gallery-comment-hint"></div>
      </aside>
    </div>
  </div>

<script src="js/app.js"></script>
<script>
  gallerySayfasiBaslat();
</script>
</body>
</html>
