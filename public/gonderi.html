<link rel="stylesheet" href="css/style.css" />
</head>

  <div class="navbar">
    <div class="nav-icerik">
      <div class="nav-sol">
        <a href="/" class="navbar-mark">
          <svg class="seal" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="22" stroke="#c9a227" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="17" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
            <path d="M24 12 L27 20 L35 20 L28.5 25 L31 33 L24 28 L17 33 L19.5 25 L13 20 L21 20 Z" fill="#c9a227"/>
          </svg>
          <div class="wordmark">CONGRESS</div></a><span class="nav-ayrac"></span>
        <a href="/uyeler" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>ÜYELER</span></a>
        <a href="/filmler" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M7 4v16M17 4v16M2.5 9h19M2.5 15h19"/></svg><span>FİLM &amp; DİZİ</span></a>
        <a href="https://congress.archiedux.com" target="_blank" class="nav-link" style="color: var(--brass-bright);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>CONGRESS WİKİ</span></a>
      </div>
      <div class="nav-sag" id="navSag"></div>
    </div>
  </div>

  <div class="mainframe gonderi-detay-mainframe">
    <div class="gonderi-detay-sayfa">
      <div class="gonderi-detay-ust">
        <a href="javascript:history.back()" class="gonderi-detay-geri">← Geri</a>
        <span class="gonderi-detay-baslik">Gönderi</span>
      </div>

      <div id="gonderiDetayKart" class="gonderi-detay-kart-alani">
        <span class="bos-hint" style="padding: 48px 0;">Yükleniyor...</span>
      </div>

      <div class="gonderi-yorumlar">
        <div class="gonderi-yorum-baslik">Yorumlar <span id="gonderiYorumSayisi"></span></div>

        <div class="gonderi-yorum-form" id="gonderiYorumForm" style="display:none;">
          <textarea id="gonderiYorumMetni" rows="2" maxlength="300" placeholder="Bir şeyler yaz... (Enter ile gönder)" onkeydown="gonderiYorumKeydown(event)"></textarea>
          <div class="gonderi-yorum-form-alt">
            <span class="gonderi-yorum-durum" id="gonderiYorumDurum"></span>
            <button type="button" class="komp-paylas-btn" onclick="gonderiYorumGonder()">Yorumla</button>
          </div>
        </div>

        <div class="gonderi-yorum-giris" id="gonderiYorumGiris" style="display:none;">
          <p>Yorum yapmak için giriş yapmalısın.</p>
          <a href="/auth/login" class="discord-giris-btn">Discord ile Giriş Yap</a>
        </div>

        <div id="gonderiYorumListe" class="gonderi-yorum-listesi"></div>
      </div>
    </div>
  </div>

<script src="js/app.js"></script>
<script>
  gonderiSayfasiBaslat();
</script>
</body>
</html>
